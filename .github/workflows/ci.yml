name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_backtester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_backtester"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://quant:quant@localhost:5432/quant_backtester
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply schema migrations
        run: python scripts/migrate.py

      - name: Run tests
        run: pytest tests/ -v

  # Deploy job goes here once the app is actually running on AWS (ECS/EC2 +
  # RDS) -- build/push a Docker image to ECR and update the ECS service on
  # merge to main, gated on `needs: test` so a broken build never deploys.
  # Left out for now rather than stubbed, since a job that can't do
  # anything without AWS credentials configured as repo secrets is just
  # dead YAML until that infrastructure exists.
