apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: quant-backtester
data:
  # In-cluster DNS: Kubernetes Services get a stable name resolvable from
  # any pod in the namespace, so this is "postgres"/"redis", not localhost.
  DATABASE_URL: postgresql+psycopg://quant:quant@postgres:5432/quant_backtester
  REDIS_URL: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: quant-backtester
type: Opaque
stringData:
  POSTGRES_USER: quant
  POSTGRES_PASSWORD: quant
  POSTGRES_DB: quant_backtester
