apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: quant-backtester
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: quant-backtester:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "quant_backtester.api.tasks:celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef: {name: app-config}
