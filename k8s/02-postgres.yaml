apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: quant-backtester
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: quant-backtester
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  strategy:
    type: Recreate  # single ReadWriteOnce volume -- never run two postgres pods at once
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: {name: postgres-credentials}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quant", "-d", "quant_backtester"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quant-backtester
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
