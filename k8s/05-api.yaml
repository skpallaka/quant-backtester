apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: quant-backtester
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: quant-backtester:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: {name: app-config}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: quant-backtester
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 5000
